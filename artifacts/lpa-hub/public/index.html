<!DOCTYPE html>
<html lang="en" style="background-color:#050505">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>LPA</title>
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LPA" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="LPA Hub - Legendary Prep Academy's daily hub for athletes, parents, coaches and staff." />
    <style id="expo-reset">
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
    <style id="lpa-web-foundation">
:root { color-scheme: dark; --lpa-bg: #050505; --lpa-card: #121212; --lpa-copper: #AB562B; --lpa-seafoam: #7FC8B5; }
html, body { height: 100%; background: var(--lpa-bg); }
/* Track the dynamic viewport so the app shrinks with browser chrome and the keyboard. */
@supports (height: 100dvh) { html, body { height: 100dvh; } }
#root { height: 100%; flex: 1; }
body { margin: 0; overflow: hidden; overscroll-behavior: none; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
/* Robust fallback stack so text paints immediately while Inter loads (font-display swap). */
body, input, textarea, select, button { font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
#root { display: flex; flex-direction: column; }
@media (min-width: 900px) { body { background: radial-gradient(1200px 600px at 50% -10%, rgba(171,86,43,0.14), transparent 60%), radial-gradient(900px 500px at 100% 110%, rgba(127,200,181,0.07), transparent 60%), var(--lpa-bg); } }
/* iOS Safari zooms inputs under 16px; keep them readable and stop zoom-on-focus. */
@media (max-width: 820px) and (pointer: coarse) { input, textarea, select { font-size: 16px !important; } }
input, textarea { caret-color: var(--lpa-copper); }
input::placeholder, textarea::placeholder { color: #8E8F8A; opacity: 1; }
input:-webkit-autofill, input:-webkit-autofill:focus { -webkit-text-fill-color: #FFFFFF; -webkit-box-shadow: 0 0 0 1000px #121212 inset; transition: background-color 9999s; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--lpa-seafoam); outline-offset: 2px; border-radius: 8px; }
::selection { background: rgba(171, 86, 43, 0.55); color: #FFFFFF; }
* { scrollbar-width: thin; scrollbar-color: #2C2C2C transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #2C2C2C; border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }
[role="button"], button, a { cursor: pointer; touch-action: manipulation; }
img { -webkit-user-drag: none; }
</style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run LPA Hub.</noscript>
    <div id="root"></div>
  </body>
</html>
